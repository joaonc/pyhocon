[tox]
envlist = flake8, py{310,311,312,313,314}

[testenv]
deps =
  pytest
  coveralls
commands =
	coverage run --source=pyhocon -m pytest tests/
	coverage report -m
	coveralls

[testenv:dateutil]
deps =
  pytest
  python-dateutil>=2.8.0
commands =
	pytest tests/

[testenv:flake8]
basepython = python
deps = flake8
commands = flake8 pyhocon tests setup.py
